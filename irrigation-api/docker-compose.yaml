version: '3.8'

services:
  irrigation-app:
    build: .
    container_name: my-irrigation-app
    ports:
    - "8001:8000"
    environment:
    - irrigation_api_key=${IRRIGATION_API_KEY}
    - POSTGRES_USER=${POSTGRES_USER}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRES_DB=${POSTGRES_DB}
    - DB_HOST=${DB_HOST}
    restart: always
  db:
    image: postgres:15-alpine
    container_name: irrigation-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_HOST${DB_HOST}
    ports:
      - "5432:5432"
volumes:
  postgres_data: