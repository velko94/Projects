services:
  irrigation-frontend:
    build: ./frontend
    container_name: irrigation-FE
    ports:
      - "8080:80"
    depends_on:
      - irrigation-backend
    deploy:
      resources:
        limits:
          memory: 256M


  irrigation-backend:
    build: .
    container_name: irrigation-BE
    ports:
      - "8001:8000"
    environment:
      - DB_TYPE=postgres
      - IRRIGATION_API_KEY=${IRRIGATION_API_KEY}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_HOST=${DB_HOST}
    restart: on-failure:5
    depends_on:
      irrigation-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  irrigation-db:
    image: postgres:15-alpine
    container_name: irrigation-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_HOST=${DB_HOST}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 3s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: { }