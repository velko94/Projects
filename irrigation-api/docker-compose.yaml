version: '3.8'

services:
  irrigation-app:
    build: .
    container_name: my-irrigation-app
    ports:
      - "8001:8000"
    environment:
      - IRRIGATION_API_KEY=${IRRIGATION_API_KEY}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_HOST=${DB_HOST}
    restart: always
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:15-alpine
    container_name: irrigation-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_HOST=${DB_HOST}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL","pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 3s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: { }