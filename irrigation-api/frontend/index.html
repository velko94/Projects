<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Irrigation Control Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Горе вдясно бутони за автентикация -->
<div id="top-auth-bar" class="top-bar">
    <div id="login-trigger-section">
        <button onclick="openLoginModal()">Вход</button>
        <button class="btn-secondary" onclick="openRegisterModal()">Регистрация</button>
    </div>
    <div id="user-info" style="display: none; align-items: center; gap: 10px;">
        <p style="margin: 0;">Добре дошъл, <span id="current-username"></span>!</p>
        <button onclick="openAddZoneModal()" style="background-color: #4CAF50; cursor: pointer;">+ Добави зона</button>
        <button onclick="logoutUser()">Изход</button>
    </div>
</div>

<h1>🌱 Ravna Smart Irrigation Panel</h1>

<!-- Модален прозорец за Вход -->
<div id="login-modal" class="modal">
    <div class="modal-content card">
        <span class="close-btn" onclick="closeLoginModal()">&times;</span>
        <h3>Вход в системата</h3>
        <form onsubmit="event.preventDefault(); loginUser();" novalidate>
            <input type="text" id="login-username" placeholder="Потребителско име"><br><br>
            <div class="password-container">
                <input type="password" id="login-password" placeholder="Парола">
                <span class="password-toggle" onclick="togglePasswordVisibility('login-password')">👁️</span>
            </div>
            <div id="login-error" class="error-msg"></div><br>
            <button type="submit">Вход</button>
        </form>
    </div>
</div>
<!-- Модален прозорец за Добавяне на зона -->
<div id="add-zone-modal" class="modal">
    <div class="modal-content card">
        <span class="close-btn" onclick="closeAddZoneModal()">&times;</span>
        <h3>Добавяне на нова зона</h3>
        <form onsubmit="event.preventDefault(); addZone();">
            <input type="text" id="newZoneName" placeholder="Име на зоната (напр. Оранжерия)"><br><br>
            <div id="add-zone-error" class="error-msg"></div><br>
            <button type="submit">Запиши зоната</button>
        </form>
    </div>
</div>

<!-- Модален прозорец за Регистрация -->
<div id="register-modal" class="modal">
    <div class="modal-content card">
        <span class="close-btn" onclick="closeRegisterModal()">&times;</span>
        <h3>Регистрация на нов потребител</h3>
        <form onsubmit="event.preventDefault(); registerUser();" novalidate>
            <input type="text" id="reg-username" placeholder="Потребителско име"><br><br>
            <div class="password-container">
                <input type="password" id="reg-password" placeholder="Парола">
                <span class="password-toggle" onclick="togglePasswordVisibility('reg-password')">👁️</span>
            </div>
            <div id="reg-error" class="error-msg"></div><br>
            <button type="submit">Запиши се</button>
        </form>
    </div>
</div>

<template id="zone-card-template">
    <div class="card">
        <h3 class="zone-name"></h3>
        <div class="zone-status"></div>
        <p class="zone-watered"></p>
        <button class="btn-toggle">Пусни / Спри</button>
        <button class="btn-delete" style="background-color: #d9534f; margin-top: 5px;">Изтрий</button>
    </div>
</template>

<!-- Централно табло със зоните -->
<div class="grid" id="zones-container">
</div>

<script src="app.js"></script>
</body>
</html>
