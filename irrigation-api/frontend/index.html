<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Irrigation Control Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navigation & Auth Bar -->
    <div id="top-auth-bar" class="top-bar">
        <div id="login-trigger-section">
            <button onclick="openLoginModal()">Login</button>
            <button class="btn-secondary" onclick="openRegisterModal()">Register</button>
        </div>
        <div id="user-info" class="user-info-bar">
            <p class="welcome-text">Welcome, <span id="current-username"></span>!</p>
            <button class="btn-success" onclick="openAddZoneModal()">+ Add Zone</button>
            <button class="btn-danger" onclick="logoutUser()">Logout</button>
        </div>
    </div>

    <h1>🌱 Ravna Smart Irrigation Panel</h1>

    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content card">
            <span class="close-btn" onclick="closeLoginModal()">&times;</span>
            <h3>System Login</h3>
            <form onsubmit="event.preventDefault(); loginUser();" novalidate>
                <input type="text" id="login-username" placeholder="Username"><br><br>
                <div class="password-container">
                    <input type="password" id="login-password" placeholder="Password">
                    <span class="password-toggle" onclick="togglePasswordVisibility('login-password')">👁️</span>
                </div>
                <div id="login-error" class="error-msg"></div><br>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>

    <!-- Add Zone Modal -->
    <div id="add-zone-modal" class="modal">
        <div class="modal-content card">
            <span class="close-btn" onclick="closeAddZoneModal()">&times;</span>
            <h3>Add New Zone</h3>
            <form onsubmit="event.preventDefault(); addZone();">
                <input type="text" id="newZoneName" placeholder="Zone name (e.g. Greenhouse)"><br><br>
                <div id="add-zone-error" class="error-msg"></div><br>
                <button type="submit">Save Zone</button>
            </form>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="register-modal" class="modal">
        <div class="modal-content card">
            <span class="close-btn" onclick="closeRegisterModal()">&times;</span>
            <h3>User Registration</h3>
            <form onsubmit="event.preventDefault(); registerUser();" novalidate>
                <input type="text" id="reg-username" placeholder="Username"><br><br>
                <div class="password-container">
                    <input type="password" id="reg-password" placeholder="Password">
                    <span class="password-toggle" onclick="togglePasswordVisibility('reg-password')">👁️</span>
                </div>
                <div id="reg-error" class="error-msg"></div><br>
                <button type="submit">Register</button>
            </form>
        </div>
    </div>

    <!-- HTML Template for dynamic zone cards -->
    <template id="zone-card-template">
        <div class="card">
            <h3 class="zone-name"></h3>
            <div class="zone-status"></div>
            <p class="zone-watered"></p>
            <button class="btn-toggle">Toggle On / Off</button>
            <button class="btn-delete btn-danger zone-delete-btn">Delete</button>
        </div>
    </template>

    <!-- Central dashboard grid for zones -->
    <div class="grid" id="zones-container"></div>

    <script src="app.js"></script>
</body>
</html>
