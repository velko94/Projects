name: ci.yml

on:
  push:
    branches: [ "master", "main", "ACC", "dev" ]
  pull_request:
    branches: [ "master", "main", "ACC", "dev" ]

jobs:
  # 1. Runs on PRs to catch errors before merging (Required status check)
  test:
    name: Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite with pytest
        env:
          IRRIGATION_API_KEY: "dummy_test_api_key_for_ci"
          JWT_SECRET: "dummy_test_jwt_secret_for_ci"
        run: |
          pytest -v

  # 2. Executes on merge to ACC -> records deployment in ACC environment and unlocks PR to master
  deploy-acc:
    name: Deploy & Verify ACC
    needs: test
    if: github.ref == 'refs/heads/ACC' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ACC

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: ACC Verification
        run: |
          echo "Successfully verified and deployed to ACC environment."
          # Add actual staging/ACC deployment script here later

  # 3. Executes on merge to master -> pauses for manual review (Required reviewer) before PRD deployment
  deploy-prd:
    name: Deploy to Production (PRD)
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: PRD

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: PRD Deployment
        run: |
          echo "Approved and deploying to PRD environment."
