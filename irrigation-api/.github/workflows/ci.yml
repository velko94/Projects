name: CI Pipeline

on:
  push:
    branches: [ "master", "main", "test_env" ]
    paths:
      - 'irrigation-api/**'
  pull_request:
    branches: [ "master", "main" ]
    paths:
      - 'irrigation-api/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./irrigation-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite with pytest
        env:
          IRRIGATION_API_KEY: "dummy_test_api_key_for_ci"
          JWT_SECRET: "dummy_test_jwt_secret_for_ci"
        run: |
          PYTHONPATH=. pytest -v