name: Irrigation_CI

on:
  push:
    branches: [ "master", "main", "ACC", "dev" ]
  pull_request:
    branches: [ "master", "main", "ACC", "dev" ]

jobs:
  # 1. Runs on PRs to catch errors before merging (Required status check)
  test:
    name: irrigation_acc
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./irrigation-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite with pytest
        working-directory: ./irrigation-api
        env:
          IRRIGATION_API_KEY: "dummy_test_api_key_for_ci"
          JWT_SECRET: "dummy_test_jwt_secret_for_ci"
        run: |
          pytest -v

  # 2. Executes on merge to ACC
  deploy-acc:
    name: Deploy & Verify ACC
    needs: test
    if: github.ref == 'refs/heads/ACC' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ACC

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: ACC Verification
        run: |
          echo "Successfully verified and deployed to ACC environment."

  # 3. Executes on merge to master (PRD)
  deploy-prd:
    name: irrigation_prd
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: PRD

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: PRD Deployment
        run: |
          echo "Approved and deploying to PRD environment."
