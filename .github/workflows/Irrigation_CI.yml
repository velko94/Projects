name: Irrigation_CI

on:
  push:
    branches: [ "master", "main", "ACC", "dev" ]
  pull_request:
    branches: [ "master", "main", "ACC", "dev" ]

jobs:
  test:
    name: irrigation_acc
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: irrigation
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./irrigation-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite with pytest
        working-directory: ./irrigation-api
        env:
          PYTHONPATH: .
          IRRIGATION_API_KEY: "dummy_test_api_key_for_ci"
          JWT_SECRET: "dummy_test_jwt_secret_for_ci"
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "postgres"
          POSTGRES_DB: "irrigation"
          DB_HOST: "localhost"
        run: |
          pytest -v